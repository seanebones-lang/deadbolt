name: Editor installation kit

on:
  pull_request:
    paths: ['docs/assets/editor_setup.py', 'docs/EDITORS.md', 'docs/EDITOR-TUTORIAL.md', 'docs/editors.html', 'docs/editor-tutorial.html', 'dist/build_editor_guides.py', 'tests/editor_acceptance.py', '.github/workflows/editor-kit.yml']
  push:
    branches: [main]
    paths: ['docs/assets/editor_setup.py', 'docs/EDITORS.md', 'docs/EDITOR-TUTORIAL.md', 'docs/editors.html', 'docs/editor-tutorial.html', 'dist/build_editor_guides.py', 'tests/editor_acceptance.py', '.github/workflows/editor-kit.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generated-guides:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install markdown-it-py==4.2.0
      - run: python dist/build_editor_guides.py
      - run: git diff --exit-code -- docs/editors.html docs/editor-tutorial.html
  independent-consumer:
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-15, macos-15-intel, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Download immutable published bundle
        run: gh release download mcpb-v1.1.0 --repo seanebones-lang/deadbolt --pattern deadbolt-1.1.0.mcpb --dir build/downloads
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Verify external-consumer setup and effects
        run: python tests/editor_acceptance.py --bundle build/downloads/deadbolt-1.1.0.mcpb --out build/editor-acceptance.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: editor-kit-${{ matrix.os }}
          path: build/editor-acceptance.json
          if-no-files-found: warn
