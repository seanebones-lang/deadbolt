name: Editor installation kit

on:
  pull_request:
    paths: ['docs/assets/editor_setup.py', 'docs/assets/editor_setup_v2.py', 'docs/EDITORS-V2.md', 'docs/editors-v2.html', 'docs/EDITORS.md', 'docs/EDITOR-TUTORIAL.md', 'docs/editors.html', 'docs/editor-tutorial.html', 'dist/build_editor_guides.py', 'tests/editor_acceptance.py', 'tests/editor_v2_acceptance.py', '.github/workflows/editor-kit.yml']
  push:
    branches: [main]
    paths: ['docs/assets/editor_setup.py', 'docs/assets/editor_setup_v2.py', 'docs/EDITORS-V2.md', 'docs/editors-v2.html', 'docs/EDITORS.md', 'docs/EDITOR-TUTORIAL.md', 'docs/editors.html', 'docs/editor-tutorial.html', 'dist/build_editor_guides.py', 'tests/editor_acceptance.py', 'tests/editor_v2_acceptance.py', '.github/workflows/editor-kit.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generated-guides:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - run: python -m pip install markdown-it-py==4.2.0
      - run: python dist/build_editor_guides.py
      - run: git diff --exit-code -- docs/editors.html docs/editor-tutorial.html docs/editors-v2.html
  independent-consumer:
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-15, macos-15-intel, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
      - name: Download immutable published bundle
        run: gh release download mcpb-v1.1.0 --repo seanebones-lang/deadbolt --pattern deadbolt-1.1.0.mcpb --dir build/downloads
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Verify external-consumer setup and effects
        run: python tests/editor_acceptance.py --bundle build/downloads/deadbolt-1.1.0.mcpb --out build/editor-acceptance.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: editor-kit-${{ matrix.os }}
          path: build/editor-acceptance.json
          if-no-files-found: warn

  v2-consumer:
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-15, macos-15-intel, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
      - name: Download immutable published bundle
        run: gh release download mcpb-v2.0.0 --repo seanebones-lang/deadbolt --pattern deadbolt-2.0.0.mcpb --dir build/downloads
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Verify external-consumer setup and effects
        run: python tests/editor_v2_acceptance.py --bundle build/downloads/deadbolt-2.0.0.mcpb --out build/editor-v2-acceptance.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: editor-v2-${{ matrix.os }}
          path: build/editor-v2-acceptance.json
          if-no-files-found: warn
