name: FastMCP recipe
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read

concurrency:
  group: fastmcp-${{ github.ref }}
  cancel-in-progress: true
jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: python -m pip install pip-audit==2.10.1
      - run: pip-audit --no-deps --disable-pip --progress-spinner off -r tests/fastmcp-requirements.txt
  consumer:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: stable
      - run: cargo build --locked --bin deadbolt
      - run: python -m pip install build==1.3.0
      - run: python -m pip install --require-hashes -r tests/fastmcp-requirements.txt
      - run: python -m build --outdir release-artifacts/python
      - name: Install the built client wheel
        run: python -c "import pathlib,subprocess,sys; wheel=next(pathlib.Path('release-artifacts/python').glob('*.whl')); subprocess.run([sys.executable,'-m','pip','install','--no-deps',str(wheel)],check=True)"
      - name: Outside-checkout stdio effect acceptance
        if: runner.os != 'Windows'
        run: python tests/fastmcp_acceptance.py --binary target/debug/deadbolt
      - name: Outside-checkout stdio effect acceptance
        if: runner.os == 'Windows'
        run: python tests/fastmcp_acceptance.py --binary target/debug/deadbolt.exe
