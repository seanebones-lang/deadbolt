name: FastMCP recipe
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install pip-audit==2.10.1
      - run: pip-audit --no-deps --disable-pip --progress-spinner off -r tests/fastmcp-requirements.txt
  consumer:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: stable
      - run: cargo build --locked --bin deadbolt
      - run: python -m pip install build==1.3.0 -r tests/fastmcp-requirements.txt
      - run: python -m build --outdir release-artifacts/python
      - name: Install the built client wheel
        run: python -c "import pathlib,subprocess,sys; wheel=next(pathlib.Path('release-artifacts/python').glob('*.whl')); subprocess.run([sys.executable,'-m','pip','install','--no-deps',str(wheel)],check=True)"
      - name: Outside-checkout stdio effect acceptance
        if: runner.os != 'Windows'
        run: python tests/fastmcp_acceptance.py --binary target/debug/deadbolt
      - name: Outside-checkout stdio effect acceptance
        if: runner.os == 'Windows'
        run: python tests/fastmcp_acceptance.py --binary target/debug/deadbolt.exe
