name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      DEADBOLT_STORE_DIAGNOSTICS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - run: cargo fmt --check
      - name: Repeat independent-connection concurrency tests
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          for ($attempt = 1; $attempt -le 10; $attempt++) {
            Write-Output "Concurrency attempt $attempt"
            cargo test --locked --test reuse -- --nocapture
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - run: cargo test --locked
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo build --locked --bin deadbolt
      - run: cargo run --locked --bin deadbolt -- drill
      - run: cargo run --locked --example build_in
      - run: python examples/evaluate.py --binary target/debug/deadbolt
        if: runner.os != 'Windows'
      - run: python examples/evaluate.py --binary target/debug/deadbolt.exe
        if: runner.os == 'Windows'
      - run: python tests/client_contract.py
        if: runner.os != 'Windows'
      - run: python tests/client_contract.py
        if: runner.os == 'Windows'
        env:
          DEADBOLT_BIN: target/debug/deadbolt.exe
  msrv:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # 1.85.0
        with:
          toolchain: 1.85.0
      - run: cargo check --locked --all-targets
      - run: cargo doc --locked --no-deps
        env:
          RUSTDOCFLAGS: '-D warnings'
      - run: cargo package --locked
