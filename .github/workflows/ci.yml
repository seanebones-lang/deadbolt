name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python -m pip install pip-audit==2.10.1
      - name: Audit the pinned optional SDK and build dependency set
        run: pip-audit --no-deps --disable-pip --progress-spinner off --format json --output python-dependency-audit.json --requirement tests/openai-agents-requirements.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: python-dependency-audit
          path: python-dependency-audit.json
          retention-days: 7
          if-no-files-found: warn
  executor-cancellation:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
      - run: cargo build --locked --bin deadbolt
      - run: python -m pip install --no-deps .
      - name: Installed helper owns disposable process cleanup
        run: python tests/executor_acceptance.py --binary target/debug/deadbolt
        if: runner.os != 'Windows'
      - name: Unsupported host refuses before execution
        run: python tests/executor_acceptance.py --binary target/debug/deadbolt.exe
        if: runner.os == 'Windows'
  python-integration:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
      - run: cargo build --locked --bin deadbolt
      - run: python -m pip install build==1.3.0
      - name: Verify outside-checkout packaging and install the pinned SDK contract
        run: python tests/python_package_acceptance.py --install-sdk
      - name: Private Unix state under permissive process umasks
        run: python tests/private_state_acceptance.py --binary target/debug/deadbolt
        if: runner.os != 'Windows'
      - name: Foreign-owned state refused in isolated privileged fixtures
        run: sudo /usr/bin/python3 tests/private_state_acceptance.py --binary target/debug/deadbolt --ownership-only
        if: runner.os == 'Linux'
      - name: Linux ACL fixture utility
        run: sudo apt-get update -qq && sudo apt-get install -y -qq acl
        if: runner.os == 'Linux'
      - name: Extended and inherited Linux ACL state refused
        run: python tests/private_state_acceptance.py --binary target/debug/deadbolt --acl-only
        if: runner.os == 'Linux'
      - name: Installed heartbeat helper stops with its trusted job
        run: python tests/heartbeat_contract.py
      - name: Real SDK Runner and sidecar acceptance without API requests
        run: python tests/openai_agents_acceptance.py
        if: runner.os != 'Windows'
      - name: Real SDK Runner and sidecar acceptance without API requests
        run: python tests/openai_agents_acceptance.py
        if: runner.os == 'Windows'
        env:
          DEADBOLT_BIN: target/debug/deadbolt.exe
      - name: Offline one-command SDK integration demo
        run: python examples/openai_agents_demo.py --binary target/debug/deadbolt
        if: runner.os != 'Windows'
      - name: Offline one-command SDK integration demo
        run: python examples/openai_agents_demo.py --binary target/debug/deadbolt.exe
        if: runner.os == 'Windows'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Installed Python and Node callbacks respect fixed lease deadlines
        run: python tests/deadline_client_acceptance.py --binary target/debug/deadbolt
        if: runner.os != 'Windows'
      - name: Installed Python and Node callbacks respect fixed lease deadlines
        run: python tests/deadline_client_acceptance.py --binary target/debug/deadbolt.exe
        if: runner.os == 'Windows'
      - name: Installed client respects separate supervisor liveness and fixed deadlines
        run: python tests/supervision_client_acceptance.py --binary target/debug/deadbolt
        if: runner.os != 'Windows'
      - name: Installed client respects separate supervisor liveness and fixed deadlines
        run: python tests/supervision_client_acceptance.py --binary target/debug/deadbolt.exe
        if: runner.os == 'Windows'
      - name: Installed client and MCP backends recheck all registered ancestors
        run: python tests/ancestor_client_acceptance.py --binary target/debug/deadbolt
        if: runner.os != 'Windows'
      - name: Installed client and MCP backends recheck all registered ancestors
        run: python tests/ancestor_client_acceptance.py --binary target/debug/deadbolt.exe
        if: runner.os == 'Windows'
      - name: Unix HTTP operator authority is explicit
        run: python tests/unix_authority_acceptance.py --binary target/debug/deadbolt
        if: runner.os != 'Windows'
      - name: Raw MCP proxy requires explicit lease and policy setup
        run: python tests/proxy_setup_acceptance.py --binary target/debug/deadbolt
        if: runner.os != 'Windows'
      - name: Raw MCP proxy requires explicit lease and policy setup
        run: python tests/proxy_setup_acceptance.py --binary target/debug/deadbolt.exe
        if: runner.os == 'Windows'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-client-${{ matrix.os }}
          path: release-artifacts/python/*
          retention-days: 7
          if-no-files-found: error
  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
      - run: cargo install cargo-audit --version 0.22.2 --locked
      - name: Check locked dependencies against the current RustSec database
        run: cargo audit --json > rustsec-audit.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: rustsec-audit
          path: rustsec-audit.json
          retention-days: 7
          if-no-files-found: warn
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      DEADBOLT_STORE_DIAGNOSTICS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - run: cargo fmt --check
      - name: Shared landing player navigation regressions
        run: node tests/landing_player.cjs
      - name: Verify archive signing preflight without credentials
        run: python tests/release_contract.py
      - name: Repeat independent-connection concurrency tests
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          for ($attempt = 1; $attempt -le 10; $attempt++) {
            Write-Output "Concurrency attempt $attempt"
            cargo test --locked --test reuse -- --nocapture
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            cargo test --locked --lib credentials::tests::scoped_independent_connections_consume_only_one_approval -- --exact --nocapture
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      # These tests retain their internal simultaneous threads/connections.
      # Avoid unrelated SQLite fixtures exhausting the bounded busy timeout on Windows.
      - run: cargo test --locked
        if: runner.os != 'Windows'
      - run: cargo test --locked -- --test-threads=1
        if: runner.os == 'Windows'
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo build --locked --bin deadbolt
      - run: cargo run --locked --bin deadbolt -- drill
      - run: cargo run --locked --example build_in
      - run: python examples/evaluate.py --binary target/debug/deadbolt
        if: runner.os != 'Windows'
      - run: python examples/evaluate.py --binary target/debug/deadbolt.exe
        if: runner.os == 'Windows'
      - run: python tests/client_contract.py
        if: runner.os != 'Windows'
      - run: python tests/client_contract.py
        if: runner.os == 'Windows'
        env:
          DEADBOLT_BIN: target/debug/deadbolt.exe
  msrv:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@3230091d7ef9483f601620abacc570c22cf44d22 # 1.85.0
        with:
          toolchain: 1.85.0
      - run: cargo check --locked --all-targets
      - run: cargo doc --locked --no-deps
        env:
          RUSTDOCFLAGS: '-D warnings'
      - name: Exclude ignored local build files from Cargo packages
        run: python tests/crate_contents.py
      - run: cargo package --locked
      - name: Verify an outside-checkout embedded consumer
        run: python tests/packaged_consumer.py
      - name: Compile original v1 and migrated v2 Rust consumers
        run: python tests/rust_api_migration.py
