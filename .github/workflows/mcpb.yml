name: MCP bundle

on:
  pull_request:
    paths: ['.gitattributes', 'src/**', 'Cargo.toml', 'Cargo.lock', 'dist/mcpb/**', 'dist/build_mcpb.py', 'tests/mcpb*_acceptance.py', '.github/workflows/mcpb.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mcp-bundle-${{ github.ref }}
  cancel-in-progress: true

jobs:
  installed-bundle:
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-15, macos-15-intel, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
      - name: Download pinned published engine
        run: gh release download v2.0.0 --repo seanebones-lang/deadbolt --pattern '*.zip' --dir build/downloads
        env:
          GH_TOKEN: ${{ github.token }}
      - run: python dist/build_mcpb.py --downloads build/downloads --out build/mcpb
      - run: npm install --prefix build/tools --ignore-scripts --no-audit --no-fund @anthropic-ai/mcpb@2.1.2
      - run: node build/tools/node_modules/@anthropic-ai/mcpb/dist/cli/cli.js pack build/mcpb/bundle build/deadbolt.mcpb
      - run: node build/tools/node_modules/@anthropic-ai/mcpb/dist/cli/cli.js unpack build/deadbolt.mcpb build/installed
      - run: python tests/mcpb_acceptance.py --bundle build/installed --mcpb-module build/tools/node_modules/@anthropic-ai/mcpb --expect-damaged-store-refusal --expect-conflicting-destination-refusal --out build/acceptance.json
      - uses: dtolnay/rust-toolchain@3230091d7ef9483f601620abacc570c22cf44d22
        with:
          toolchain: 1.85.0
      - run: cargo build --locked --release --bin deadbolt
      - name: Verify the matching source engine through the installed launcher
        if: runner.os != 'Windows'
        run: python tests/mcpb_source_acceptance.py --bundle build/installed --binary target/release/deadbolt --mcpb-module build/tools/node_modules/@anthropic-ai/mcpb --out build/source-acceptance.json
      - name: Verify the matching source engine through the installed launcher
        if: runner.os == 'Windows'
        run: python tests/mcpb_source_acceptance.py --bundle build/installed --binary target/release/deadbolt.exe --mcpb-module build/tools/node_modules/@anthropic-ai/mcpb --out build/source-acceptance.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: mcpb-${{ matrix.os }}
          path: |
            build/acceptance.json
            build/source-acceptance.json
            build/deadbolt.mcpb
          if-no-files-found: warn
