name: release candidate

on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

concurrency:
  group: release-candidate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            binary: target/release/deadbolt
          - os: macos-15
            target: aarch64-apple-darwin
            binary: target/release/deadbolt
          - os: macos-15-intel
            target: x86_64-apple-darwin
            binary: target/release/deadbolt
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: target/release/deadbolt.exe
            rustflags: '-C target-feature=+crt-static'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@3230091d7ef9483f601620abacc570c22cf44d22 # 1.85.0
        with:
          toolchain: 1.85.0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - run: cargo build --locked --release --bin deadbolt
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - run: python -m pip install build==1.3.0
      - name: Build and install the matching wheel from an outside-checkout sdist
        run: python tests/python_package_acceptance.py --install-wheel
      - run: python dist/package_release.py --binary ${{ matrix.binary }} --target ${{ matrix.target }}
      - name: Verify extracted downloads and upgrades from both published versions
        run: python tests/native_candidate_acceptance.py --target ${{ matrix.target }} --published-upgrades > native-candidate.json
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deadbolt-${{ matrix.target }}
          path: |
            release-artifacts/*.zip
            release-artifacts/*.sha256
            release-artifacts/python/*
            native-candidate.json
          retention-days: 7
          if-no-files-found: error
  provenance:
    # PR jobs keep read-only credentials. Only the tested main build is attested.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-unknown-linux-gnu, aarch64-apple-darwin, x86_64-apple-darwin, x86_64-pc-windows-msvc]
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: deadbolt-${{ matrix.target }}
          path: verified-native
      - name: Attest the tested native archive bytes
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: verified-native/release-artifacts/*.zip
      - name: Verify provenance against this repository, workflow and exact source
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SOURCE: ${{ github.sha }}
        run: |
          python - <<'PY'
          import os, pathlib, subprocess
          archives = list(pathlib.Path('verified-native/release-artifacts').glob('*.zip'))
          assert len(archives) == 1, 'expected exactly one tested native archive'
          result = subprocess.check_output([
              'gh', 'attestation', 'verify', str(archives[0]),
              '--repo', 'seanebones-lang/deadbolt',
              '--signer-workflow', 'seanebones-lang/deadbolt/.github/workflows/release-candidate.yml',
              '--source-ref', 'refs/heads/main', '--source-digest', os.environ['EXPECTED_SOURCE'],
              '--format', 'json'], text=True)
          pathlib.Path('native-provenance-verification.json').write_text(result)
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deadbolt-provenance-${{ matrix.target }}
          path: |
            ${{ steps.attest.outputs.bundle-path }}
            native-provenance-verification.json
          if-no-files-found: error
          retention-days: 7
  hermes-mcp:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@3230091d7ef9483f601620abacc570c22cf44d22 # 1.85.0
        with:
          toolchain: 1.85.0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - run: cargo build --release --locked --bin deadbolt
      - name: Prepare independent host and reference server
        shell: bash
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/NousResearch/hermes-agent.git "$RUNNER_TEMP/hermes"
          git -C "$RUNNER_TEMP/hermes" checkout 5eb1381f3965fd96454d1c32f6bbefcd99cda347
          python -m pip install --require-hashes -r tests/hermes-acceptance-requirements.txt
          npm install --prefix "$RUNNER_TEMP/mcp-reference" --ignore-scripts --no-audit --no-fund @modelcontextprotocol/server-filesystem@2026.8.31
      - name: Verify actual tool effects through Hermes MCP
        shell: bash
        run: |
          python tests/hermes_mcp_acceptance.py \
            --hermes "$RUNNER_TEMP/hermes" \
            --binary target/release/deadbolt \
            --filesystem-server "$RUNNER_TEMP/mcp-reference/node_modules/@modelcontextprotocol/server-filesystem/dist/index.js" \
            > hermes-acceptance.json
      - name: Verify pre-v1 state upgrade
        shell: bash
        run: |
          git fetch origin b8a13036567ca1b71ed14c6b36cbf84df80fe647
          mkdir -p "$RUNNER_TEMP/deadbolt-baseline"
          git archive b8a13036567ca1b71ed14c6b36cbf84df80fe647 | tar -x -C "$RUNNER_TEMP/deadbolt-baseline"
          cargo build --release --locked --manifest-path "$RUNNER_TEMP/deadbolt-baseline/Cargo.toml" --target-dir "$RUNNER_TEMP/deadbolt-baseline-build" --bin deadbolt
          python tests/upgrade_acceptance.py \
            --old-binary "$RUNNER_TEMP/deadbolt-baseline-build/release/deadbolt" \
            --new-binary target/release/deadbolt > upgrade-acceptance.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hermes-mcp-acceptance
          path: |
            hermes-acceptance.json
            upgrade-acceptance.json
          retention-days: 7
          if-no-files-found: error
