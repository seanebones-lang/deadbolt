name: plugin security scan

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: plugin-security-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: hashgraph-online/ai-plugin-scanner-action@d0e7bf3ebeb0312c347e51f1dc3552fb264b426c # v1.2.766
        with:
          plugin_dir: '.'
          min_score: 80
          fail_on_severity: high
          online: false
          upload_sarif: false
          submission_enabled: false
          trust_repository_policy: false
