name: publish-python

on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish the verified 1.1.0rc1 release to PyPI (irreversible version allocation)'
        type: boolean
        default: false
        required: true

permissions:
  contents: read

concurrency:
  group: publish-python
  cancel-in-progress: false

jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: 52a2085155b658f3d1dda5a73a8d95a7a1d88fad
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Download and verify the immutable release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(git rev-parse HEAD)" = '52a2085155b658f3d1dda5a73a8d95a7a1d88fad'
          mkdir -p python-publish-dist engine
          gh release download v1.1.0-rc.1 --repo seanebones-lang/deadbolt \
            --pattern 'n11_deadbolt_client-*' --dir python-publish-dist
          gh release download v1.1.0-rc.1 --repo seanebones-lang/deadbolt \
            --pattern 'deadbolt-1.1.0-rc.1-x86_64-unknown-linux-gnu.zip' --dir engine
          python - <<'PY'
          import email, hashlib, pathlib, zipfile
          expected = {
              'python-publish-dist/n11_deadbolt_client-1.1.0rc1-py3-none-any.whl': 'e8ac19f1f8aeb544e95504bafbf69f87e53e6fc85e1826802a57c98a1abc7153',
              'python-publish-dist/n11_deadbolt_client-1.1.0rc1.tar.gz': 'd83629e52b2cc620b550d54aa6b3e155e8cdfa8ac7734f8159e7edc0a466ade5',
              'engine/deadbolt-1.1.0-rc.1-x86_64-unknown-linux-gnu.zip': '1f81dfceef7db020f3afe3aff6340115f9e2fb21fece32a6c45940f91698fcad',
          }
          assert sorted(p.name for p in pathlib.Path('python-publish-dist').iterdir()) == sorted(pathlib.Path(p).name for p in expected if p.startswith('python-publish-dist/'))
          for name, sha in expected.items():
              assert hashlib.sha256(pathlib.Path(name).read_bytes()).hexdigest() == sha, name
          with zipfile.ZipFile('python-publish-dist/n11_deadbolt_client-1.1.0rc1-py3-none-any.whl') as z:
              for module in ('deadbolt_client', 'deadbolt_openai_agents'):
                  assert z.read(module+'.py') == pathlib.Path('examples', module+'.py').read_bytes()
              meta = email.message_from_bytes(z.read('n11_deadbolt_client-1.1.0rc1.dist-info/METADATA'))
              assert meta['Name'] == 'n11-deadbolt-client' and meta['Version'] == '1.1.0rc1'
              assert meta['Requires-Python'] == '>=3.9'
              assert meta.get_all('Requires-Dist') == ['openai-agents==0.23.1; extra == "openai-agents"']
          with zipfile.ZipFile('engine/deadbolt-1.1.0-rc.1-x86_64-unknown-linux-gnu.zip') as z:
              z.extractall('engine')
          pathlib.Path('engine/deadbolt-1.1.0-rc.1-x86_64-unknown-linux-gnu/deadbolt').chmod(0o755)
          PY
      - name: Verify installed base client without optional dependencies
        run: |
          python -m venv /tmp/deadbolt-base
          /tmp/deadbolt-base/bin/python -m pip install --no-deps --no-index python-publish-dist/*.whl
          DEADBOLT_SOCK=/tmp/deadbolt-nonexistent.sock /tmp/deadbolt-base/bin/python -I - <<'PY'
          import importlib.util, pathlib, sys, deadbolt_client, deadbolt_openai_agents
          assert pathlib.Path(deadbolt_client.__file__).is_relative_to(pathlib.Path(sys.prefix))
          assert importlib.util.find_spec('agents') is None
          def forbidden():
              raise AssertionError('denied body ran')
          assert deadbolt_client.dispatch('synthetic', 'write_file', forbidden) == {
              'executed': False, 'decision': {'decision': 'deny', 'code': 'store_unavailable'}}
          PY
          /tmp/deadbolt-base/bin/deadbolt-client --help
      - name: Validate metadata and real installed SDK behavior
        run: |
          python -m pip install twine==6.2.0
          python -m twine check --strict python-publish-dist/*
          python -m pip install -r tests/openai-agents-requirements.txt
          python -m pip install --no-deps --no-index python-publish-dist/*.whl
          python -m pip check
          DEADBOLT_BIN="$PWD/engine/deadbolt-1.1.0-rc.1-x86_64-unknown-linux-gnu/deadbolt" \
            python -I tests/openai_agents_acceptance.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verified-python-distributions
          path: python-publish-dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    if: inputs.publish && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/n11-deadbolt-client/1.1.0rc1/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: verified-python-distributions
          path: python-publish-dist/
      - name: Publish exact verified distributions with short-lived credentials and attestations
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: python-publish-dist/
          skip-existing: false
          attestations: true
