name: publish-python

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Exact verified Python distribution version and matching engine'
        type: choice
        options: ['2.0.1', '2.0.1.post1', '2.0.2']
        default: '2.0.2'
        required: true
      publish:
        description: 'Publish the selected verified version to PyPI (irreversible version allocation)'
        type: boolean
        default: false
        required: true

permissions:
  contents: read

concurrency:
  group: publish-python
  cancel-in-progress: false

jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ENGINE_VERSION: ${{ inputs.version == '2.0.2' && '2.0.2' || '2.0.1' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.version == '2.0.2' && '7d130e882d03b9ba82556fb072f646d4191bbe8a' || inputs.version == '2.0.1' && 'e87519f700be03c27a564ed274907649224d256f' || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Download and verify the immutable release assets
        if: inputs.version != '2.0.2'
        env:
          GH_TOKEN: ${{ github.token }}
          SELECTED_VERSION: ${{ inputs.version }}
          DISPATCH_SHA: ${{ github.sha }}
        run: |
          case "$SELECTED_VERSION" in
            2.0.1) test "$(git rev-parse HEAD)" = 'e87519f700be03c27a564ed274907649224d256f' ;;
            2.0.1.post1) test "$(git rev-parse HEAD)" = "$DISPATCH_SHA" ;;
            *) exit 1 ;;
          esac
          mkdir -p python-publish-dist original-python engine
          gh release download v2.0.1 --repo seanebones-lang/deadbolt \
            --pattern 'n11_deadbolt_client-*' --dir original-python
          gh release download v2.0.1 --repo seanebones-lang/deadbolt \
            --pattern 'deadbolt-2.0.1-x86_64-unknown-linux-gnu.zip' --dir engine
          python - <<'PY'
          import email, hashlib, pathlib, zipfile
          expected = {
              'original-python/n11_deadbolt_client-2.0.1-py3-none-any.whl': '13e1eab6457ba62865864e007f14d6c3a84ca366f81cc6152e181a49d05a2a59',
              'original-python/n11_deadbolt_client-2.0.1.tar.gz': '0edea5787d8a7bb7fc8873149d954b85c0b8798054f45d7e761d1abc4be2857a',
              'engine/deadbolt-2.0.1-x86_64-unknown-linux-gnu.zip': 'c2340e58a74ac79d97644912d9bf03bf7f0cadd51b9cc0c802ec0a1fadf02856',
          }
          assert sorted(p.name for p in pathlib.Path('original-python').iterdir()) == sorted(pathlib.Path(p).name for p in expected if p.startswith('original-python/'))
          for name, sha in expected.items():
              assert hashlib.sha256(pathlib.Path(name).read_bytes()).hexdigest() == sha, name
          with zipfile.ZipFile('original-python/n11_deadbolt_client-2.0.1-py3-none-any.whl') as z:
              for module in ('deadbolt_client', 'deadbolt_openai_agents', 'deadbolt_supervisor'):
                  assert z.read(module+'.py') == pathlib.Path('examples', module+'.py').read_bytes()
              meta = email.message_from_bytes(z.read('n11_deadbolt_client-2.0.1.dist-info/METADATA'))
              assert meta['Name'] == 'n11-deadbolt-client' and meta['Version'] == '2.0.1'
              assert meta['Requires-Python'] == '>=3.9'
              assert meta.get_all('Requires-Dist') == ['openai-agents==0.23.1; extra == "openai-agents"']
          with zipfile.ZipFile('engine/deadbolt-2.0.1-x86_64-unknown-linux-gnu.zip') as z:
              z.extractall('engine')
          pathlib.Path('engine/deadbolt-2.0.1-x86_64-unknown-linux-gnu/deadbolt').chmod(0o755)
          PY
      - name: Download and verify the pinned 2.0.2 security release
        if: inputs.version == '2.0.2'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(git rev-parse HEAD)" = '7d130e882d03b9ba82556fb072f646d4191bbe8a'
          mkdir -p python-publish-dist engine
          gh release download v2.0.2 --repo seanebones-lang/deadbolt \
            --pattern 'n11_deadbolt_client-*' --dir python-publish-dist
          gh release download v2.0.2 --repo seanebones-lang/deadbolt \
            --pattern 'deadbolt-2.0.2-x86_64-unknown-linux-gnu.zip' --dir engine
          python - <<'PYVERIFY'
          import email, hashlib, json, pathlib, tarfile, zipfile
          version = '2.0.2'
          source = '7d130e882d03b9ba82556fb072f646d4191bbe8a'
          expected = {
              'python-publish-dist/n11_deadbolt_client-2.0.2-py3-none-any.whl': 'c9ff4722daabeebbfe78aaa07b4ce2c350ba13be1f250eded422f8c0b6d58c12',
              'python-publish-dist/n11_deadbolt_client-2.0.2.tar.gz': 'a4b02f0da97aa2e62eaf27fb3eda08964554cd7d59e622f5d599aaa72b0c79ea',
              'engine/deadbolt-2.0.2-x86_64-unknown-linux-gnu.zip': 'c2e1e50fba85a5014f2c2ac9eafeceadc8c06ec2c24aef7f8b121ad836639d9f',
          }
          assert len(list(pathlib.Path('python-publish-dist').iterdir())) == 2
          for name, sha in expected.items():
              assert hashlib.sha256(pathlib.Path(name).read_bytes()).hexdigest() == sha, name
          with zipfile.ZipFile('python-publish-dist/n11_deadbolt_client-2.0.2-py3-none-any.whl') as wheel, tarfile.open('python-publish-dist/n11_deadbolt_client-2.0.2.tar.gz') as sdist:
              modules = ('deadbolt_client.py', 'deadbolt_openai_agents.py', 'deadbolt_supervisor.py')
              assert sorted(n for n in wheel.namelist() if n.endswith('.py')) == sorted(modules)
              for module in modules:
                  original = pathlib.Path('examples', module).read_bytes()
                  assert wheel.read(module) == original
                  assert sdist.extractfile('n11_deadbolt_client-2.0.2/examples/' + module).read() == original
              meta = email.message_from_bytes(wheel.read('n11_deadbolt_client-2.0.2.dist-info/METADATA'))
              assert meta['Name'] == 'n11-deadbolt-client' and meta['Version'] == version
              assert meta['Requires-Python'] == '>=3.9'
              assert meta.get_all('Requires-Dist') == ['openai-agents==0.23.1; extra == "openai-agents"']
              assert meta.get_payload() == pathlib.Path('docs/PYPI.md').read_text()
          with zipfile.ZipFile('engine/deadbolt-2.0.2-x86_64-unknown-linux-gnu.zip') as archive:
              build = json.loads(archive.read('deadbolt-2.0.2-x86_64-unknown-linux-gnu/BUILD.json'))
              assert build['version'] == version and build['source_revision'] == source
              archive.extractall('engine')
          pathlib.Path('engine/deadbolt-2.0.2-x86_64-unknown-linux-gnu/deadbolt').chmod(0o755)
          PYVERIFY
      - name: Select immutable original distributions
        if: inputs.version == '2.0.1'
        run: cp original-python/* python-publish-dist/
      - name: Build and verify the metadata-only postrelease from this exact main commit
        if: inputs.version == '2.0.1.post1'
        run: |
          python -m pip install build==1.3.0 packaging==26.3
          python tests/python_package_acceptance.py
          python - <<'PY'
          import email, hashlib, json, pathlib, subprocess, tarfile, zipfile
          root = pathlib.Path('.')
          version = '2.0.1.post1'
          wheel = root / 'release-artifacts/python' / ('n11_deadbolt_client-' + version + '-py3-none-any.whl')
          sdist = root / 'release-artifacts/python' / ('n11_deadbolt_client-' + version + '.tar.gz')
          modules = ('deadbolt_client.py', 'deadbolt_openai_agents.py', 'deadbolt_supervisor.py')
          with zipfile.ZipFile('original-python/n11_deadbolt_client-2.0.1-py3-none-any.whl') as original, zipfile.ZipFile(wheel) as current, tarfile.open(sdist) as source:
              assert sorted(n for n in current.namelist() if n.endswith('.py')) == sorted(modules)
              for module in modules:
                  expected = original.read(module)
                  assert current.read(module) == expected, module
                  assert source.extractfile('n11_deadbolt_client-' + version + '/examples/' + module).read() == expected, module
              meta = email.message_from_bytes(current.read('n11_deadbolt_client-' + version + '.dist-info/METADATA'))
              assert meta['Version'] == version and meta['Name'] == 'n11-deadbolt-client'
              assert meta['Requires-Python'] == '>=3.9'
              assert meta.get_all('Requires-Dist') == ['openai-agents==0.23.1; extra == "openai-agents"']
              assert meta.get_payload() == pathlib.Path('docs/PYPI.md').read_text()
          receipt = {'version': version, 'engine_version': '2.0.1', 'source': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(), 'runtime_modules_unchanged': list(modules), 'sha256': {p.name: hashlib.sha256(p.read_bytes()).hexdigest() for p in (wheel, sdist)}}
          pathlib.Path('postrelease-verification.json').write_text(json.dumps(receipt, indent=2) + '\n')
          print(json.dumps(receipt, indent=2))
          for artifact in (wheel, sdist):
              pathlib.Path('python-publish-dist', artifact.name).write_bytes(artifact.read_bytes())
          assert len(list(pathlib.Path('python-publish-dist').iterdir())) == 2
          PY
      - name: Verify installed base client without optional dependencies
        run: |
          python -m venv /tmp/deadbolt-base
          /tmp/deadbolt-base/bin/python -m pip install --no-deps --no-index python-publish-dist/*.whl
          DEADBOLT_SOCK=/tmp/deadbolt-nonexistent.sock /tmp/deadbolt-base/bin/python -I - <<'PY'
          import importlib.util, pathlib, sys, deadbolt_client, deadbolt_openai_agents, deadbolt_supervisor
          for module in (deadbolt_client, deadbolt_openai_agents, deadbolt_supervisor):
              assert pathlib.Path(module.__file__).is_relative_to(pathlib.Path(sys.prefix))
          assert importlib.util.find_spec('agents') is None
          def forbidden():
              raise AssertionError('denied body ran')
          assert deadbolt_client.dispatch('synthetic', 'write_file', forbidden) == {
              'executed': False, 'decision': {'decision': 'deny', 'code': 'store_unavailable'}}
          PY
          /tmp/deadbolt-base/bin/deadbolt-client --help
      - name: Validate metadata and real installed SDK behavior
        run: |
          python -m pip install twine==6.2.0
          python -m twine check --strict python-publish-dist/*
          python -m pip install --require-hashes -r tests/openai-agents-requirements.txt
          python -m pip install --no-deps --no-index python-publish-dist/*.whl
          python -m pip check
          DEADBOLT_BIN="$PWD/engine/deadbolt-${ENGINE_VERSION}-x86_64-unknown-linux-gnu/deadbolt" \
            python -I tests/openai_agents_acceptance.py
      - name: Verify installed deadline and supervisor behavior against the released engine
        run: |
          /tmp/deadbolt-base/bin/python -I tests/deadline_client_acceptance.py \
            --binary "$PWD/engine/deadbolt-${ENGINE_VERSION}-x86_64-unknown-linux-gnu/deadbolt"
          /tmp/deadbolt-base/bin/python -I tests/supervision_client_acceptance.py \
            --binary "$PWD/engine/deadbolt-${ENGINE_VERSION}-x86_64-unknown-linux-gnu/deadbolt"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - name: Verify installed POSIX process supervisor on its supported Python runtime
        run: |
          python -m venv /tmp/deadbolt-executor
          /tmp/deadbolt-executor/bin/python -m pip install --no-deps --no-index python-publish-dist/*.whl
          /tmp/deadbolt-executor/bin/python -I - <<'PY'
          import deadbolt_supervisor
          assert deadbolt_supervisor.supported(), 'acceptance must exercise POSIX cancellation, not skip it'
          PY
          /tmp/deadbolt-executor/bin/python -I tests/executor_acceptance.py \
            --binary "$PWD/engine/deadbolt-${ENGINE_VERSION}-x86_64-unknown-linux-gnu/deadbolt"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verified-python-distributions
          path: python-publish-dist/*
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: inputs.version == '2.0.1.post1'
        with:
          name: python-postrelease-verification
          path: postrelease-verification.json
          if-no-files-found: error
          retention-days: 7

  publish:
    if: inputs.publish && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/n11-deadbolt-client/${{ inputs.version }}/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: verified-python-distributions
          path: python-publish-dist/
      - name: Publish exact verified distributions with short-lived credentials and attestations
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          packages-dir: python-publish-dist/
          skip-existing: false
          attestations: true
