name: publish-python

on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish the verified 2.0.0rc1 release to PyPI (irreversible version allocation)'
        type: boolean
        default: false
        required: true

permissions:
  contents: read

concurrency:
  group: publish-python
  cancel-in-progress: false

jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: d14f81f974c556446e520d896acf7761f73861e6
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Download and verify the immutable release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(git rev-parse HEAD)" = 'd14f81f974c556446e520d896acf7761f73861e6'
          mkdir -p python-publish-dist engine
          gh release download v2.0.0-rc.1 --repo seanebones-lang/deadbolt \
            --pattern 'n11_deadbolt_client-*' --dir python-publish-dist
          gh release download v2.0.0-rc.1 --repo seanebones-lang/deadbolt \
            --pattern 'deadbolt-2.0.0-rc.1-x86_64-unknown-linux-gnu.zip' --dir engine
          python - <<'PY'
          import email, hashlib, pathlib, zipfile
          expected = {
              'python-publish-dist/n11_deadbolt_client-2.0.0rc1-py3-none-any.whl': '1e728a7c742652249228e27eee381a5753159bbe5a552613faa809bec8ddac6b',
              'python-publish-dist/n11_deadbolt_client-2.0.0rc1.tar.gz': '68e6e082e9f2be1409798f74f8f740ffd72e3cba93b0db279e1cff0cc35a5cbc',
              'engine/deadbolt-2.0.0-rc.1-x86_64-unknown-linux-gnu.zip': '0559183a38ca8e08c95e20133462847cf42d2dc1f87f8c09f7248cee098cc229',
          }
          assert sorted(p.name for p in pathlib.Path('python-publish-dist').iterdir()) == sorted(pathlib.Path(p).name for p in expected if p.startswith('python-publish-dist/'))
          for name, sha in expected.items():
              assert hashlib.sha256(pathlib.Path(name).read_bytes()).hexdigest() == sha, name
          with zipfile.ZipFile('python-publish-dist/n11_deadbolt_client-2.0.0rc1-py3-none-any.whl') as z:
              for module in ('deadbolt_client', 'deadbolt_openai_agents', 'deadbolt_supervisor'):
                  assert z.read(module+'.py') == pathlib.Path('examples', module+'.py').read_bytes()
              meta = email.message_from_bytes(z.read('n11_deadbolt_client-2.0.0rc1.dist-info/METADATA'))
              assert meta['Name'] == 'n11-deadbolt-client' and meta['Version'] == '2.0.0rc1'
              assert meta['Requires-Python'] == '>=3.9'
              assert meta.get_all('Requires-Dist') == ['openai-agents==0.23.1; extra == "openai-agents"']
          with zipfile.ZipFile('engine/deadbolt-2.0.0-rc.1-x86_64-unknown-linux-gnu.zip') as z:
              z.extractall('engine')
          pathlib.Path('engine/deadbolt-2.0.0-rc.1-x86_64-unknown-linux-gnu/deadbolt').chmod(0o755)
          PY
      - name: Verify installed base client without optional dependencies
        run: |
          python -m venv /tmp/deadbolt-base
          /tmp/deadbolt-base/bin/python -m pip install --no-deps --no-index python-publish-dist/*.whl
          DEADBOLT_SOCK=/tmp/deadbolt-nonexistent.sock /tmp/deadbolt-base/bin/python -I - <<'PY'
          import importlib.util, pathlib, sys, deadbolt_client, deadbolt_openai_agents, deadbolt_supervisor
          for module in (deadbolt_client, deadbolt_openai_agents, deadbolt_supervisor):
              assert pathlib.Path(module.__file__).is_relative_to(pathlib.Path(sys.prefix))
          assert importlib.util.find_spec('agents') is None
          def forbidden():
              raise AssertionError('denied body ran')
          assert deadbolt_client.dispatch('synthetic', 'write_file', forbidden) == {
              'executed': False, 'decision': {'decision': 'deny', 'code': 'store_unavailable'}}
          PY
          /tmp/deadbolt-base/bin/deadbolt-client --help
      - name: Validate metadata and real installed SDK behavior
        run: |
          python -m pip install twine==6.2.0
          python -m twine check --strict python-publish-dist/*
          python -m pip install --require-hashes -r tests/openai-agents-requirements.txt
          python -m pip install --no-deps --no-index python-publish-dist/*.whl
          python -m pip check
          DEADBOLT_BIN="$PWD/engine/deadbolt-2.0.0-rc.1-x86_64-unknown-linux-gnu/deadbolt" \
            python -I tests/openai_agents_acceptance.py
      - name: Verify installed deadline and supervisor behavior against the released engine
        run: |
          /tmp/deadbolt-base/bin/python -I tests/deadline_client_acceptance.py \
            --binary "$PWD/engine/deadbolt-2.0.0-rc.1-x86_64-unknown-linux-gnu/deadbolt"
          /tmp/deadbolt-base/bin/python -I tests/supervision_client_acceptance.py \
            --binary "$PWD/engine/deadbolt-2.0.0-rc.1-x86_64-unknown-linux-gnu/deadbolt"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14'
      - name: Verify installed POSIX process supervisor on its supported Python runtime
        run: |
          python -m venv /tmp/deadbolt-executor
          /tmp/deadbolt-executor/bin/python -m pip install --no-deps --no-index python-publish-dist/*.whl
          /tmp/deadbolt-executor/bin/python -I - <<'PY'
          import deadbolt_supervisor
          assert deadbolt_supervisor.supported(), 'acceptance must exercise POSIX cancellation, not skip it'
          PY
          /tmp/deadbolt-executor/bin/python -I tests/executor_acceptance.py \
            --binary "$PWD/engine/deadbolt-2.0.0-rc.1-x86_64-unknown-linux-gnu/deadbolt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verified-python-distributions
          path: python-publish-dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    if: inputs.publish && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/n11-deadbolt-client/2.0.0rc1/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: verified-python-distributions
          path: python-publish-dist/
      - name: Publish exact verified distributions with short-lived credentials and attestations
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: python-publish-dist/
          skip-existing: false
          attestations: true
