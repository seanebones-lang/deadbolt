version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    ignore:
      # Hold sha2 patch updates: 0.11.1 requires rustc 1.88, above the
      # project MSRV of 1.85. Revisit when the MSRV reaches 1.88.
      - dependency-name: "sha2"
        update-types: ["version-update:semver-patch"]
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
