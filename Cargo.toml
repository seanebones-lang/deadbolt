[package]
name = "n11-deadbolt"
description = "Local execution gate for software agents: leases, policy, operator revocation, and structured evidence."
version = "1.1.0-rc.1"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/seanebones-lang/deadbolt"
readme = "README.md"
homepage = "https://github.com/seanebones-lang/deadbolt"
authors = ["NextEleven LLC"]
keywords = ["agents", "security", "containment"]
categories = ["command-line-utilities"]
include = [
    "src/**/*",
    "examples/*.rs",
    "examples/*.py",
    "examples/*.js",
    "docs/**/*",
    "!docs/assets/**",
    "!docs/*.html",
    "tests/*.rs",
    "tests/*.py",
    "tests/*.Dockerfile",
    "tests/*.txt",
    "README.md",
    "LICENSE",
    "NOTICE",
    "THIRD-PARTY.md",
    "third-party/**/*",
    "SECURITY.md",
    "CONTRIBUTING.md",
    "CHANGELOG.md",
    "Dockerfile",
    "dist/deadbolt.service",
    "dist/docker-compose.yml",
    "dist/deadbolt.env.example",
    "dist/package_release.py",
    "dist/sign_macos_archive.py",
    "dist/collect_licenses.py",
    "Cargo.toml",
    "Cargo.lock",
    "pyproject.toml",
    "requirements.lock",
    "MANIFEST.in",
]
rust-version = "1.85"

[dependencies]
clap = { version = "4", features = ["derive"] }
dirs = "5"
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
serde_jcs = "=0.2.0"
sha2 = "0.11"
thiserror = "1"
tokio = { version = "1", features = ["time"] }
tempfile = "3"
getrandom = "0.4"

[[bin]]
name = "deadbolt"
path = "src/main.rs"

[lib]
name = "deadbolt"
path = "src/lib.rs"

[[example]]
name = "build_in"
path = "examples/build_in.rs"
